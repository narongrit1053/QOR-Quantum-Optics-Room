[package]
name = "lab-app"
description = "LabSetup desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lab_app"
path = "src/lib.rs"

[[bin]]
name = "labsetup"
path = "src/main.rs"

[dependencies]
lab-core.workspace = true
lab-geom.workspace = true
lab-file.workspace = true
lab-viewport.workspace = true
lab-ui.workspace = true
slint.workspace = true
async-channel.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Com",
] }
