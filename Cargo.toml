[workspace]
resolver = "3"
members = [
    "crates/lab-core",
    "crates/lab-geom",
    "crates/lab-file",
    "crates/lab-catalog",
    "crates/lab-viewport",
    "crates/lab-ui",
    "crates/lab-app",
    "crates/lab-parts",
    "crates/lab-mates",
    "crates/lab-import",
    "crates/lab-optics",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
lab-core = { path = "crates/lab-core" }
lab-viewport = { path = "crates/lab-viewport" }
lab-ui = { path = "crates/lab-ui" }
lab-geom = { path = "crates/lab-geom" }
lab-file = { path = "crates/lab-file" }
lab-catalog = { path = "crates/lab-catalog" }
lab-parts = { path = "crates/lab-parts" }
lab-mates = { path = "crates/lab-mates" }
lab-import = { path = "crates/lab-import" }
lab-optics = { path = "crates/lab-optics" }

# Slint and Bevy must share one wgpu major version (Slint's `unstable-wgpu-30` <-> Bevy 0.20).
# Upgrade them together; see docs/DESIGN.md §9.
slint = { version = "=1.18.1", features = ["renderer-skia", "unstable-wgpu-30", "raw-window-handle-06", "unstable-winit-030"] }
slint-build = "=1.18.1"
bevy = { version = "=0.20.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "bevy_log",
    "bevy_window",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_camera",
    "bevy_light",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_picking",
    "mesh_picking",
    "bevy_gizmos_render",
    "tonemapping_luts",
    "zstd_rust",
    "bevy_gltf",
    "reflect_auto_register",
] }
wgpu = "30"
async-channel = "2"
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "1.1"
# Deflate + CRC for the project container. 1.1.10 with default features is already in the
# runtime tree (via png/usvg), so this adds no new crate and no feature change.
flate2 = "1.1"

[profile.dev]
opt-level = 1

# Bevy and Skia are unusably slow without optimisation, even in debug builds.
[profile.dev.package."*"]
opt-level = 3

# Hole and mesh computation must stay fast in debug builds (M1-SPEC D21).
[profile.dev.package.lab-core]
opt-level = 2

[profile.dev.package.lab-geom]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
